# Local dev-only reverse proxy: puts the frontend and backend behind one
# origin (see docs/saas-architecture.md's recommended "Option A" topology
# in the repo-split plan) so the session cookie is same-origin, not
# cross-port — some browsers/privacy extensions treat different ports on
# `localhost` as separate tracking contexts and drop cookies on fetch/XHR
# even though the SameSite=Lax spec itself calls that same-site.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Validate hits an upstream LLM; 120B models can exceed nginx defaults.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
